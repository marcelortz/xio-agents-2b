name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # LINT & BUILD
  # ==========================================
  lint-and-build:
    runs-on: ubuntu-latest
    name: Lint & Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  # ==========================================
  # TESTING
  # ==========================================
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # ==========================================
  # DOCKER BUILD & PUSH
  # ==========================================
  docker:
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # SECURITY SCAN
  # ==========================================
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ML Optimization Suite'
          path: '.'
          format: 'JSON'

  # ==========================================
  # DEPLOYMENT (main branch only)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create deployment status
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              description: 'ML Optimization Suite v${{ github.sha }}',
              auto_merge: false,
              required_contexts: []
            });

      - name: Deployment notification
        run: |
          echo "✅ Production deployment triggered"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"

  # ==========================================
  # SUMMARY
  # ==========================================
  summary:
    runs-on: ubuntu-latest
    name: CI/CD Summary
    needs: [lint-and-build, test, docker, security]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "📊 CI/CD Pipeline Summary"
          echo "=========================="
          echo "Lint & Build: ${{ needs.lint-and-build.result }}"
          echo "Tests:        ${{ needs.test.result }}"
          echo "Docker:       ${{ needs.docker.result }}"
          echo "Security:     ${{ needs.security.result }}"
          echo ""
          if [ "${{ needs.lint-and-build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ]; then
            echo "❌ Pipeline failed!"
            exit 1
          fi
          echo "✅ Pipeline passed!"
