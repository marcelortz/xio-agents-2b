apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xio-agents-api
  namespace: xio-agents
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.xio-agents.example.com
      secretName: xio-agents-tls
  rules:
    - host: api.xio-agents.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xio-agents-api
                port:
                  number: 80
